name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dependency_source:
        description: Core dependency source (published is the release gate)
        type: choice
        options: [published, candidate]
        default: published

permissions:
  contents: read

jobs:
  build:
    name: ${{ (github.event_name == 'pull_request' || inputs.dependency_source == 'candidate') && 'Candidate core' || 'Published core' }} (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: attesto_client

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.1"
            otp: "27.2"
          - elixir: "1.18.4"
            otp: "28.0"
          - elixir: "1.19.4"
            otp: "28.3"
          - elixir: "1.20.1"
            otp: "29.0.2"
            lint: true

    env:
      MIX_ENV: test
      ATTESTO_PATH: ${{ (github.event_name == 'pull_request' || inputs.dependency_source == 'candidate') && '1' || '0' }}
      REVIEWED_CORE_REF: 28df935e8a74967044da1dcd8334d028dcbd6726

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          path: attesto_client

      # The reviewed core is not published yet. PR checks use this explicit
      # immutable candidate; main and default manual runs require public Hex.
      - name: Checkout reviewed candidate core
        if: env.ATTESTO_PATH == '1'
        uses: actions/checkout@v7.0.1
        with:
          repository: XukuLLC/attesto
          ref: ${{ env.REVIEWED_CORE_REF }}
          path: attesto

      - name: Verify candidate checkout identity
        if: env.ATTESTO_PATH == '1'
        run: |
          test "$(git -C ../attesto rev-parse HEAD)" = "$REVIEWED_CORE_REF"
          test -z "$(git -C ../attesto status --porcelain)"
          echo 'Testing the pinned core source candidate; public Hex compatibility remains pending.' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # The cross-language parity tests verify Attesto-issued artifacts against
      # independent implementations. The Python leg (JARM + request objects)
      # shells out to PyJWT, and the Edwards leg drives Node's built-in crypto.
      # Both self-skip when their runtime is absent, so install them here or CI
      # would silently cover less than it appears to.
      - name: Set up Python (PyJWT parity leg)
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python parity dependencies
        run: python -m pip install --upgrade pip pyjwt cryptography

      - name: Restore dependencies cache
        uses: actions/cache@v6.1.0
        with:
          path: attesto_client/deps
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles('attesto_client/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-

      - name: Restore build cache
        uses: actions/cache@v6.1.0
        with:
          path: attesto_client/_build
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-build-${{ env.ATTESTO_PATH }}-${{ hashFiles('attesto_client/mix.lock') }}-${{ hashFiles('attesto_client/mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-build-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          # Hex validates every registry lock entry, even for an overridden
          # path dependency. Remove only this unpublished entry in candidate
          # runners; the committed release lock and published lane stay intact.
          if [ "$ATTESTO_PATH" = "1" ]; then
            mix deps.unlock attesto
          fi
          mix deps.get

      - name: Audit dependency advisories
        if: ${{ matrix.lint }}
        run: mix hex.audit

      - name: Compile pinned candidate core afresh
        if: env.ATTESTO_PATH == '1'
        run: |
          mix deps.compile
          mix deps.compile attesto --force

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Assert effective candidate dependency
        if: env.ATTESTO_PATH == '1'
        run: >-
          mix run --no-compile -e 'dep = Enum.find(Mix.Dep.cached(), &(&1.app == :attesto));
          unless dep && dep.scm == Mix.SCM.Path && Path.expand(dep.opts[:dest]) == Path.expand("../attesto"), do: System.halt(1);
          unless Application.spec(:attesto, :vsn) |> to_string() == "2.3.1", do: System.halt(1)'

      - name: Run tests
        run: mix test --trace

      - name: Check formatting
        if: ${{ matrix.lint }}
        run: mix format --check-formatted

      - name: Run Credo
        if: ${{ matrix.lint }}
        run: mix credo --strict

      - name: Restore PLT cache
        if: ${{ matrix.lint }}
        uses: actions/cache@v6.1.0
        with:
          path: attesto_client/priv/plts
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-plt-

      - name: Run Dialyzer
        if: ${{ matrix.lint }}
        # dialyxir is `only: [:dev]`, so this analyses lib/ alone.
        env:
          MIX_ENV: dev
        run: mix dialyzer

  attesto-2-hex:
    name: Published Attesto 2.3.1 security compatibility
    if: github.event_name != 'pull_request' && inputs.dependency_source != 'candidate'
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: "1.20.1"
          otp-version: "29.0.2"

      - name: Set up Python (PyJWT parity leg)
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python parity dependencies
        run: python -m pip install --upgrade pip pyjwt cryptography

      - name: Resolve published Attesto 2
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.unlock attesto
          mix deps.get

      - name: Compile against published Attesto 2
        run: mix compile --warnings-as-errors

      - name: Assert published hardened Attesto dependency
        run: >-
          mix run --no-compile -e 'version = Application.spec(:attesto, :vsn) |> to_string();
          unless Version.match?(version, ">= 2.3.1 and < 3.0.0"), do: System.halt(1)'

      - name: Run tests against published Attesto 2
        run: mix test --trace
